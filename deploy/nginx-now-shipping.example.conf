# Example Nginx site for Now Shipping (Node behind reverse proxy).
# Copy/adapt for your server; paths and upstream port must match your PM2 app.
#
# Replace:
#   now.com.eg          → your domain
#   127.0.0.1:6098      → your Node listen address (see .env PORT)
#   ssl_certificate*    → your Let's Encrypt paths

upstream now_shipping_node {
    server 127.0.0.1:6098;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name now.com.eg;

    ssl_certificate     /etc/letsencrypt/live/now.com.eg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/now.com.eg/privkey.pem;

    client_max_body_size 50m;

    # After users hit HTTPS once, browsers (and some in-app WebViews) upgrade http→https automatically.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Shopify webhooks: avoid buffering so raw body + HMAC match Express
    location /api/shopify/webhooks {
        proxy_pass http://now_shipping_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Embedded Shopify Admin UI + assets
    location /shopify-app/ {
        proxy_pass http://now_shipping_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (if used from browser)
    location /socket.io/ {
        proxy_pass http://now_shipping_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://now_shipping_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# REQUIRED in production: Facebook/Instagram in-app browsers often open http:// with ?fbclid=...
# If this block is missing, port 80 falls through to nginx default_server and users see nginx 404.
server {
    listen 80;
    server_name now.com.eg;
    return 301 https://$host$request_uri;
}

# --- Post-deploy verification (run from your laptop) ---
# curl -sI "http://now.com.eg/?fbclid=test" | head -8
# Expect: HTTP/1.1 301 Moved Permanently  and  Location: https://now.com.eg/?fbclid=test
# If you see 404, the port-80 server block is not active on the origin (or Cloudflare is not
# forwarding HTTP correctly); fix nginx on the box, then `sudo nginx -t && sudo systemctl reload nginx`.
