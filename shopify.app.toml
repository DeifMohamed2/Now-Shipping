# Shopify app configuration for the Dev platform / CLI (`shopify app deploy`).
# - `client_id` = Partner Dashboard **Client ID** (same value as `SHOPIFY_API_KEY` in `.env`).
# - All HTTPS URLs below must match your live `APP_URL` origin (no trailing slash on origin).
# - For local tunnel testing, temporarily set URIs to your ngrok host, then `shopify app deploy` with production values again.
#
# See SHOPIFY-SETUP.md §6.2.

name = "Now Shipping"
client_id = "bc8079fb16c02748ab06455608643ee3"
application_url = "https://now.com.eg/shopify-app/"
embedded = true

[access_scopes]
scopes = "read_customers,read_fulfillments,write_fulfillments,read_orders,write_orders,read_all_orders"
# Do not set use_legacy_install_flow = true: it blocks app-level webhook subscriptions in this TOML
# (Shopify CLI error). OAuth still uses your Node callback at [auth].redirect_urls.

[auth]
redirect_urls = [
  "https://now.com.eg/api/shopify/auth/callback",
]

[webhooks]
api_version = "2026-04"

# Same HTTPS path for both blocks; `X-Shopify-Topic` distinguishes events (HMAC verified in Node).
[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "app/uninstalled"]
uri = "https://now.com.eg/api/shopify/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://now.com.eg/api/shopify/webhooks"
